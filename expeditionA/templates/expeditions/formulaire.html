<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Modifier une expédition{% else %}Ajouter une expédition{% endif %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f7f6; color: #183039; font: 1rem/1.5 system-ui, sans-serif; }
        header { background: #123c40; padding: 1rem; text-align: center; }
        header a { color: white; font-weight: 700; }
        main { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: clamp(1.5rem, 4vw, 2rem); }
        form { background: white; border: 1px solid #cedbd9; border-radius: .75rem; padding: clamp(1rem, 4vw, 2rem); }
        form p { margin: 0 0 1rem; }
        label { display: block; font-weight: 650; margin-bottom: .35rem; }
        input, select, textarea { width: 100%; min-height: 2.75rem; border: 1px solid #809a99; border-radius: .4rem; padding: .55rem .7rem; color: inherit; background: white; font: inherit; }
        textarea { min-height: 7rem; resize: vertical; }
        [aria-invalid="true"] { border-color: #922633; }
        .errorlist { color: #922633; margin: 0 0 .4rem; padding-left: 1.25rem; }
        :focus-visible { outline: 3px solid #287567; outline-offset: 3px; }
        .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1rem; margin-top: 1.5rem; }
        button { border: 0; border-radius: .4rem; padding: .65rem 1.1rem; background: #123c40; color: white; font: inherit; cursor: pointer; }
        button:hover { background: #20565a; }
        a { color: #155a70; text-underline-offset: .15em; }
    </style>
</head>
<body>
<header><a href="{% url 'expeditions:liste' %}">TransConnect</a></header>
<main>
    {% if object %}
        <h1>Modifier l’expédition {{ object.reference }}</h1>
    {% else %}
        <h1>Ajouter une expédition</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Enregistrer</button>
            {% if object %}
                <a href="{% url 'expeditions:detail' object.reference %}">Annuler</a>
            {% else %}
                <a href="{% url 'expeditions:liste' %}">Annuler</a>
            {% endif %}
        </div>
    </form>
</main>
</body>
</html>

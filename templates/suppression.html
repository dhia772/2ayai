{% extends 'base.html' %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<h1>Supprimer {{ label }} ?</h1>
<section class="panel">
    <p><strong>{{ objet }}</strong></p>
    {% if erreur %}
        <p class="error" role="alert">{{ erreur }}</p>
    {% else %}
        <p>Cette opération est définitive.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirmer la suppression</button>
        </form>
    {% endif %}
    <p><a href="{% url detail_url cle %}">Annuler</a></p>
</section>
{% endblock %}
